<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- Open the connections the first screen waits on while the JS loads:
         the API (log-in, then the data) and Cloudinary (logos). -->
    <link rel="preconnect" href="%VITE_API_URL%" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />

    <link rel="icon" type="image/svg+xml" href="/icons/logo-light.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/icons/logo-dark.svg" media="(prefers-color-scheme: dark)" />

    <!-- Search Console ownership (the pre-rendered pages are built from this file). -->
    <meta name="google-site-verification" content="HZtP262qceOniOXY_mL6wGY2dM2g5Mw4OXtvHIH1uQo" />

    <title>KuttukTime</title>

    <!-- In Telegram (launch params in the address, or kept by tma.js over a
         reload) the Mini App shows its own screens at once - never the
         website's pre-rendered page (#seo). -->
    <script>
      try {
        if (/tgWebApp/.test(location.hash) || sessionStorage.getItem("tapps/launchParams")) {
          document.documentElement.classList.add("tma");
        }
      } catch {}
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/app/index.tsx"></script>
  </body>
</html>
